<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifiera — felai.se</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/site.css">
  <style>
    body {
      background: var(--light-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .verify-logo {
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--heading);
      margin-bottom: 32px;
      letter-spacing: -0.01em;
    }
    .verify-logo span { color: var(--primary); }
    .verify-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(17, 12, 69, 0.08);
    }
    .verify-card h1 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .verify-card .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 28px;
    }
    .qr-box {
      background: var(--light-bg);
      border-radius: var(--radius);
      padding: 20px;
      display: inline-block;
      margin-bottom: 20px;
    }
    .qr-box img {
      width: 200px;
      height: 200px;
      display: block;
    }
    .manual {
      background: var(--light-bg);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 24px;
    }
    .manual .label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .manual .code {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 0.2em;
      color: var(--primary);
      font-family: 'SF Mono', 'Fira Code', monospace;
      line-height: 1.2;
    }
    .manual .phone {
      font-size: 0.95rem;
      margin-top: 6px;
      color: var(--body);
    }
    .status-box {
      padding: 14px 20px;
      border-radius: var(--radius-pill);
      font-weight: 700;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .status-pending {
      background: rgba(76, 84, 223, 0.08);
      color: var(--primary);
    }
    .status-verified {
      background: var(--green-bg);
      color: var(--green);
    }
    .status-expired {
      background: var(--red-bg);
      color: var(--red);
    }
  </style>
</head>
<body>
  <div class="verify-logo">felai<span>.se</span></div>

  <div class="verify-card">
    <h1>SMS-verifiering</h1>
    <p class="subtitle">Verifiera att du är <strong>{{ verification.name }}</strong></p>

    <div id="pending-content">
      <div class="qr-box">
        <img src="/api/qr?text={{ sms_uri | urlencode }}" alt="QR-kod">
      </div>

      <div class="manual">
        <div class="label">Skicka detta SMS</div>
        <div class="code">{{ verification.code }}</div>
        <div class="phone">till {{ phone_display }}</div>
      </div>
    </div>

    <div class="status-box status-pending" id="status-box">
      <span class="spinner" id="spinner"></span>
      <span id="status-text">Vantar pa SMS...</span>
    </div>
  </div>

  <script>
    var vid = "{{ vid }}";
    var done = false;

    function poll() {
      if (done) return;
      fetch('/api/verify/' + vid)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var box = document.getElementById('status-box');
          var text = document.getElementById('status-text');
          var spinner = document.getElementById('spinner');
          var content = document.getElementById('pending-content');

          if (data.status === 'verified') {
            done = true;
            box.className = 'status-box status-verified';
            spinner.style.display = 'none';
            text.textContent = 'Verifierad!';
          } else if (data.status === 'expired') {
            done = true;
            box.className = 'status-box status-expired';
            spinner.style.display = 'none';
            text.textContent = 'Verifieringen har gatt ut';
            content.style.display = 'none';
          }
        })
        .catch(function() {});
    }

    {% if verification.status == 'verified' %}
      document.getElementById('status-box').className = 'status-box status-verified';
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('status-text').textContent = 'Redan verifierad';
      document.getElementById('pending-content').style.display = 'none';
      done = true;
    {% elif verification.status == 'expired' %}
      document.getElementById('status-box').className = 'status-box status-expired';
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('status-text').textContent = 'Verifieringen har gatt ut';
      document.getElementById('pending-content').style.display = 'none';
      done = true;
    {% else %}
      setInterval(poll, 2000);
    {% endif %}
  </script>
</body>
</html>
