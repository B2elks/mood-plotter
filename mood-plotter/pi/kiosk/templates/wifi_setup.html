<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=800,initial-scale=1,user-scalable=no">
<title>WiFi-installning</title>
<style>
  :root {
    --bg: #1b1b2e;
    --card: #2a2a44;
    --accent: #ff66cc;
    --accent-strong: #ff00ff;
    --text: #ffffff;
    --muted: #b0b0d0;
    --key: #3a3a55;
    --key-active: #5a5a80;
  }
  html, body {
    margin: 0; padding: 0;
    width: 800px; height: 480px;
    font-family: -apple-system, "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--text);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    touch-action: manipulation;
  }
  body { display: flex; flex-direction: column; }
  header {
    padding: 6px 12px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #444;
    flex-shrink: 0;
  }
  header h1 { font-size: 18px; margin: 0; color: var(--accent); }
  .topbtn {
    background: var(--card); border: 1px solid #555; color: var(--text);
    padding: 6px 12px; border-radius: 6px; font-size: 15px;
  }
  main { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }

  /* Network list — kompakt for 480px hojd */
  #list-view {
    flex: 1; overflow-y: auto; padding: 4px 8px;
    display: none;
  }
  #list-view.visible { display: block; }
  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
    padding: 8px 4px 4px;
  }
  .nets { list-style: none; margin: 0; padding: 0; }
  .net {
    display: flex; align-items: center;
    padding: 10px 12px;
    border-radius: 6px;
    background: var(--card);
    margin: 4px 0;
    font-size: 16px;
    gap: 8px;
  }
  .net.tappable:active { background: var(--key-active); }
  .net .ssid { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .net .active-dot {
    color: #6fdc6f; font-size: 14px; margin-right: -2px;
  }
  .net .lock { opacity: 0.6; font-size: 13px; }
  .net .bars {
    display: inline-flex; align-items: flex-end; gap: 2px;
    height: 14px;
  }
  .net .bars span {
    display: inline-block;
    width: 4px;
    background: var(--muted);
    border-radius: 1px;
    opacity: 0.25;
  }
  .net .bars span.on { opacity: 1; background: var(--accent); }
  .net .bars span:nth-child(1) { height: 4px; }
  .net .bars span:nth-child(2) { height: 7px; }
  .net .bars span:nth-child(3) { height: 10px; }
  .net .bars span:nth-child(4) { height: 14px; }
  .net .forget {
    background: transparent; color: var(--muted);
    border: 1px solid #555; border-radius: 4px;
    padding: 5px 10px; font-size: 12px;
  }
  .net .forget.confirm { color: #ff8080; border-color: #ff8080; }

  /* Password / keyboard view */
  #pw-view {
    flex: 1; display: none; flex-direction: column;
    padding: 4px 8px;
    min-height: 0;
  }
  #pw-view.visible { display: flex; }
  #pw-ssid { font-size: 14px; color: var(--muted); margin-bottom: 4px; padding: 0 4px; }
  #pw-input-wrap {
    display: flex; align-items: center; gap: 6px;
    background: var(--card); border-radius: 6px; padding: 6px;
    margin-bottom: 4px;
    flex-shrink: 0;
  }
  #pw-input {
    flex: 1;
    font-size: 20px; padding: 6px; background: transparent;
    border: 0; color: var(--text); outline: none;
    letter-spacing: 1px;
  }
  #pw-toggle, #pw-connect, #pw-cancel {
    padding: 8px 12px; font-size: 14px;
    background: var(--key); color: var(--text);
    border: 0; border-radius: 4px;
  }
  #pw-connect { background: var(--accent-strong); font-weight: bold; }

  /* Virtual keyboard — pressade for 480px hojd */
  #kb {
    display: flex; flex-direction: column; gap: 3px;
    padding: 0 4px 4px 4px;
    flex-shrink: 0;
  }
  .kb-row { display: flex; gap: 3px; justify-content: center; }
  .kb-row button {
    flex: 1;
    height: 38px;
    font-size: 17px;
    background: var(--key); color: var(--text);
    border: 1px solid #555;
    border-radius: 4px;
    padding: 0;
  }
  .kb-row button:active, .kb-row button.active {
    background: var(--key-active);
  }
  .kb-row button[data-key="space"] { flex: 5; }
  .kb-row button[data-key="shift"], .kb-row button[data-key="back"],
  .kb-row button[data-key="layer"] { flex: 1.5; font-size: 13px; }

  #status {
    display: none;
    position: fixed; left: 50%; bottom: 14px;
    transform: translateX(-50%);
    padding: 8px 14px; border-radius: 8px;
    background: var(--card);
    font-size: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  #status.show { display: block; }
</style>
</head>
<body>
<header>
  <h1>📶 WiFi-nätverk</h1>
  <div>
    <button id="back" class="topbtn">↩ Tillbaka</button>
    <button id="refresh" class="topbtn">↻ Skanna</button>
  </div>
</header>
<main>
  <div id="list-view" class="visible">
    <div id="saved-label" class="section-label" style="display:none">Sparade</div>
    <ul id="saved" class="nets"></ul>
    <div id="avail-label" class="section-label">Tillgängliga</div>
    <ul id="available" class="nets"></ul>
  </div>

  <div id="pw-view">
    <div id="pw-ssid"></div>
    <div id="pw-input-wrap">
      <input id="pw-input" type="password" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button id="pw-toggle">👁</button>
      <button id="pw-cancel">Avbryt</button>
      <button id="pw-connect">Anslut</button>
    </div>
    <div id="kb"></div>
  </div>
</main>
<div id="status"></div>

<script>
const listView = document.getElementById('list-view');
const savedEl = document.getElementById('saved');
const savedLabel = document.getElementById('saved-label');
const availEl = document.getElementById('available');
const availLabel = document.getElementById('avail-label');
const pwView = document.getElementById('pw-view');
const pwInput = document.getElementById('pw-input');
const pwSsidEl = document.getElementById('pw-ssid');
const statusEl = document.getElementById('status');
let currentSsid = null;
let shifted = false;
let layer = 0;

function showStatus(msg, ms=2500) {
  statusEl.textContent = msg;
  statusEl.classList.add('show');
  if (ms) setTimeout(() => statusEl.classList.remove('show'), ms);
}

function bars(signal) {
  const filled = signal >= 75 ? 4 : signal >= 50 ? 3 : signal >= 25 ? 2 : signal > 0 ? 1 : 0;
  let html = '<span class="bars">';
  for (let i = 1; i <= 4; i++) {
    html += `<span class="${i <= filled ? 'on' : ''}"></span>`;
  }
  return html + '</span>';
}

async function loadAll() {
  availEl.innerHTML = '<li class="net"><span class="ssid">Skannar…</span></li>';
  savedEl.innerHTML = '';
  savedLabel.style.display = 'none';

  const [netsRes, savedRes] = await Promise.all([
    fetch('/api/networks'),
    fetch('/api/saved'),
  ]);
  const nets = await netsRes.json();
  const savedData = await savedRes.json();
  const saved = savedData.saved || [];
  const activeSsid = savedData.active || '';

  // Index live signals by SSID so saved entries can show strength if visible.
  const sigByName = {};
  const securedByName = {};
  for (const n of nets) {
    sigByName[n.ssid] = n.signal;
    securedByName[n.ssid] = n.secured;
  }

  // Render saved section.
  if (saved.length) {
    savedLabel.style.display = 'block';
    for (const s of saved) {
      const li = document.createElement('li');
      li.className = 'net';
      const sig = sigByName[s.name] ?? 0;
      const isActive = s.active || s.name === activeSsid;
      li.innerHTML = `
        ${isActive ? '<span class="active-dot">●</span>' : ''}
        <span class="ssid">${escapeHtml(s.name)}</span>
        ${bars(sig)}
        <button class="forget" data-name="${escapeAttr(s.name)}">Glöm</button>
      `;
      li.querySelector('.forget').addEventListener('click', (ev) => {
        ev.stopPropagation();
        onForget(ev.currentTarget, s.name);
      });
      savedEl.appendChild(li);
    }
  }

  // Render available section — hide ones that are already saved.
  const savedNames = new Set(saved.map(s => s.name));
  availEl.innerHTML = '';
  const visible = nets.filter(n => !savedNames.has(n.ssid));
  if (!visible.length) {
    availEl.innerHTML = '<li class="net"><span class="ssid">Inga andra nät synliga</span></li>';
    return;
  }
  for (const n of visible) {
    const li = document.createElement('li');
    li.className = 'net tappable';
    li.innerHTML = `
      <span class="ssid">${escapeHtml(n.ssid)}</span>
      <span class="lock">${n.secured ? '🔒' : ''}</span>
      ${bars(n.signal)}
    `;
    li.addEventListener('click', () => choose(n));
    availEl.appendChild(li);
  }
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/'/g, '&#39;');
}

async function onForget(btn, name) {
  if (!btn.classList.contains('confirm')) {
    btn.classList.add('confirm');
    btn.textContent = 'Säker?';
    setTimeout(() => {
      btn.classList.remove('confirm');
      btn.textContent = 'Glöm';
    }, 3500);
    return;
  }
  btn.disabled = true;
  btn.textContent = '…';
  try {
    const res = await fetch('/api/forget', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name}),
    });
    const data = await res.json();
    if (data.ok) {
      showStatus('Glömt: ' + name);
      loadAll();
    } else {
      showStatus('Misslyckades: ' + (data.error || 'okänt fel'));
      btn.disabled = false;
      btn.textContent = 'Glöm';
      btn.classList.remove('confirm');
    }
  } catch (e) {
    showStatus('Fel: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Glöm';
    btn.classList.remove('confirm');
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function choose(net) {
  currentSsid = net.ssid;
  pwSsidEl.textContent = '🔑 ' + net.ssid;
  pwInput.value = '';
  listView.classList.remove('visible');
  pwView.classList.add('visible');
  if (!net.secured) doConnect('');
}

function backToList() {
  pwView.classList.remove('visible');
  listView.classList.add('visible');
  currentSsid = null;
}

async function doConnect(password) {
  showStatus('Ansluter till ' + currentSsid + '…', 0);
  try {
    const res = await fetch('/api/connect', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ssid: currentSsid, password}),
    });
    const data = await res.json();
    if (data.ok) {
      showStatus('Ansluten! Laddar galleri…', 1000);
      setTimeout(() => { window.location = '/'; }, 1200);
    } else {
      showStatus('Misslyckades: ' + (data.error || 'okänt fel'));
    }
  } catch (e) {
    showStatus('Fel: ' + e.message);
  }
}

document.getElementById('refresh').addEventListener('click', loadAll);
document.getElementById('back').addEventListener('click', () => {
  if (pwView.classList.contains('visible')) backToList();
  else window.location = '/';
});
document.getElementById('pw-cancel').addEventListener('click', backToList);
document.getElementById('pw-connect').addEventListener('click', () => doConnect(pwInput.value));
document.getElementById('pw-toggle').addEventListener('click', () => {
  pwInput.type = pwInput.type === 'password' ? 'text' : 'password';
});

const LAYERS = [
  [
    ['1','2','3','4','5','6','7','8','9','0'],
    ['q','w','e','r','t','y','u','i','o','p'],
    ['a','s','d','f','g','h','j','k','l','å'],
    ['shift','z','x','c','v','b','n','m','ä','ö'],
    ['layer','-','_','.','space','@','/','back'],
  ],
  [
    ['1','2','3','4','5','6','7','8','9','0'],
    ['!','@','#','$','%','&','*','(',')','+'],
    ['-','_','=','/','\\',':',';','"',"'",'?'],
    ['shift','`','~','{','}','[',']','<','>',','],
    ['layer','.','space','back'],
  ],
];

function renderKb() {
  const kb = document.getElementById('kb');
  kb.innerHTML = '';
  for (const row of LAYERS[layer]) {
    const div = document.createElement('div');
    div.className = 'kb-row';
    for (const k of row) {
      const b = document.createElement('button');
      b.dataset.key = k;
      if (k === 'space') b.textContent = '␣';
      else if (k === 'back') b.textContent = '⌫';
      else if (k === 'shift') b.textContent = shifted ? '⇧' : 'shift';
      else if (k === 'layer') b.textContent = layer === 0 ? '#+' : 'abc';
      else b.textContent = shifted && /[a-zåäö]/.test(k) ? k.toUpperCase() : k;
      if (k === 'shift' && shifted) b.classList.add('active');
      b.addEventListener('click', () => onKey(k));
      div.appendChild(b);
    }
    kb.appendChild(div);
  }
}

function onKey(k) {
  if (k === 'shift') { shifted = !shifted; renderKb(); return; }
  if (k === 'layer') { layer = (layer + 1) % LAYERS.length; renderKb(); return; }
  if (k === 'back') { pwInput.value = pwInput.value.slice(0, -1); return; }
  if (k === 'space') { pwInput.value += ' '; return; }
  pwInput.value += shifted && /[a-zåäö]/.test(k) ? k.toUpperCase() : k;
  if (shifted) { shifted = false; renderKb(); }
}

renderKb();
loadAll();
</script>
</body>
</html>
